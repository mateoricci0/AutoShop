events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format json_combined escape=json
        '{"time":"$time_iso8601","method":"$request_method","uri":"$request_uri",'
        '"status":$status,"bytes":$body_bytes_sent,"duration":$request_time,'
        '"remote_addr":"$remote_addr","upstream":"$upstream_addr"}';

    access_log /var/log/nginx/access.log json_combined;
    error_log  /var/log/nginx/error.log warn;

    sendfile            on;
    keepalive_timeout   65;
    client_max_body_size 50M;

    gzip            on;
    gzip_comp_level 4;
    gzip_types      text/plain text/css application/json application/javascript
                    text/xml application/xml application/xml+rss text/javascript;

    # ── Upstream blocks ─────────────────────────────────────────────────────
    upstream dashboard  { server dashboard:3000; }
    upstream auth       { server auth:8001; }

    # ── Main server block ────────────────────────────────────────────────────
    server {
        listen 80;
        server_name _;

        # Health check endpoint (used by load-balancers / scripts)
        location = /nginx-health {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }

        # All traffic → Next.js dashboard
        # Next.js BFF API routes (/api/*) proxy to the individual services.
        location / {
            proxy_pass         http://dashboard;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade            $http_upgrade;
            proxy_set_header   Connection         "upgrade";
            proxy_set_header   Host               $host;
            proxy_set_header   X-Real-IP          $remote_addr;
            proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto  $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }
    }
}
