[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "ase-shared"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14.0",
    "asyncpg>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "redis[hiredis]>=5.2.0",
    "celery>=5.4.0",
    "cryptography>=43.0.0",
    "bcrypt>=4.2.0",
    "structlog>=24.4.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["ase_shared*"]
